name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ForgeCore (macOS host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

  ios:
    name: ForgeCore + app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build package for iOS
        run: |
          xcodebuild build \
            -scheme ForgeCore-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app project
        run: cd App && xcodegen generate
      - name: Build app
        run: |
          xcodebuild build \
            -project App/ForgeCAD.xcodeproj \
            -scheme ForgeCAD \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
